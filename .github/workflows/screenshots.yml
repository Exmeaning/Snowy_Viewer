# ============================================================
# Screenshot Generator - GitHub Actions Workflow
# ============================================================
# 
# Triggers:
#   - Push to main (data/master_version.txt): Incremental update on master data change
#   - Manual dispatch: Full regeneration or incremental update available manually
#
# Saves screenshots to the repository selected by SCREENSHOT_HUB_REPOSITORY.
#
# Required repository variable:
#   - SCREENSHOT_HUB_REPOSITORY: exact owner/repository destination
# Required secret:
#   - HUB_DEPLOY_TOKEN: fine-grained token with Contents read/write for only that repository
# ============================================================

name: Generate Screenshots

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'data/master_version.txt'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all screenshots'
        required: false
        default: false
        type: boolean

env:
  HUB_REPO: ${{ vars.SCREENSHOT_HUB_REPOSITORY }}
  SCREENSHOTS_PATH: screenshots

jobs:
  generate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate screenshot publication destination
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HUB_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

      - name: Checkout screenshot repository without URL credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.HUB_REPO }}
          token: ${{ secrets.HUB_DEPLOY_TOKEN }}
          path: hub-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Build and start web app
        run: |
          cd web
          npm run build
          npm run start &
          echo "Waiting for web app to start..."
          sleep 15
          curl -s --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000 > /dev/null
          echo "Web app is ready!"

      - name: Install screenshot generator dependencies
        run: |
          cd screenshot-generator
          npm ci
          npx puppeteer browsers install chrome

      - name: Copy existing screenshots
        run: |
          mkdir -p screenshots-output
          if [ -d "hub-repo/${{ env.SCREENSHOTS_PATH }}" ]; then
            cp -r hub-repo/${{ env.SCREENSHOTS_PATH }}/* screenshots-output/ || true
          fi

      - name: Generate screenshots
        run: |
          cd screenshot-generator
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_regenerate }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          WEB_URL=http://localhost:3000 \
          OUTPUT_DIR=../screenshots-output \
          CONCURRENCY=4 \
          BUILD_VERSION=${{ github.sha }} \
          node index.js $FORCE_FLAG --only cards,events,gacha,music

      - name: Commit screenshots to Hub repo
        run: |
          set -euo pipefail
          cd hub-repo
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy new screenshots
          rm -rf ${{ env.SCREENSHOTS_PATH }}
          mkdir -p ${{ env.SCREENSHOTS_PATH }}
          cp -r ../screenshots-output/* ${{ env.SCREENSHOTS_PATH }}/
          
          # Check for changes
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit and push
          COMMIT_MSG="🖼️ Update screenshots"
          if [ "${{ github.event.inputs.force_regenerate }}" == "true" ]; then
            COMMIT_MSG="🖼️ Full screenshot regeneration"
          fi
          COMMIT_MSG="$COMMIT_MSG - $(date -u '+%Y-%m-%d %H:%M UTC')"

          git commit -m "$COMMIT_MSG"

      - name: Push screenshots with process-scoped authentication
        env:
          HUB_DEPLOY_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          cd hub-repo
          auth_header=$(printf 'x-access-token:%s' "$HUB_DEPLOY_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD

      - name: Summary
        run: |
          echo "## Screenshot Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "screenshots-output/metadata.json" ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat screenshots-output/metadata.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Screenshots saved to: https://github.com/${{ env.HUB_REPO }}/tree/main/${{ env.SCREENSHOTS_PATH }}" >> $GITHUB_STEP_SUMMARY
