name: Watch Master Data

permissions:
  contents: write

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual run

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}

      - name: Update Master Data Version
        run: |
          mkdir -p data
          curl -sS --fail --retry 5 \
            "https://metadata.exmeaning.com/jp/versions/current_version.json" \
            -o /tmp/current_version.json
          python3 - <<'PY'
          import json

          with open("/tmp/current_version.json", "r", encoding="utf-8") as f:
              version = json.load(f)

          data_version = version.get("dataVersion")
          if not data_version:
              raise SystemExit("current_version.json does not contain dataVersion")

          with open("data/master_version.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write(str(data_version) + "\n")
          PY

      - name: Commit & Push Changes
        run: |
          if [[ -n $(git status --porcelain data/master_version.txt) ]]; then
            echo "Changes detected in master data version."

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/master_version.txt
            git commit -m "chore: update master data version"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in master data version."
          fi
