name: Watch Master Data

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual run

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HUB_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Update Master Data Version
        run: |
          mkdir -p data
          curl -sS --fail --retry 5 \
            "https://metadata.exmeaning.com/jp/versions/current_version.json" \
            -o /tmp/current_version.json
          python3 - <<'PY'
          import json

          with open("/tmp/current_version.json", "r", encoding="utf-8") as f:
              version = json.load(f)

          data_version = version.get("dataVersion")
          if not data_version:
              raise SystemExit("current_version.json does not contain dataVersion")

          with open("data/master_version.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write(str(data_version) + "\n")
          PY

      - name: Generate Sitemap Data
        run: |
          GITHUB_BASE="https://raw.githubusercontent.com/Team-Haruki/haruki-sekai-master/main/master"
          MASTER_DATA_URLS_JP="$GITHUB_BASE,https://metadata.exmeaning.com/jp/master,https://metadata.pjsk.moe/jp/master" \
          REQUIRE_FRESH_BUILD_DATA=1 \
          npm run sitemap --prefix web

          python3 -c "import json; json.load(open('web/public/data/sitemap-data.jp.json'))"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HUB_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update master data version and sitemap"
          branch: "chore/update-master-data"
          delete-branch: true
          title: "chore: update master data version and sitemap"
          body: "Automated master data version and sitemap update triggered by watch-master-data workflow."
          add-paths: |
            data/master_version.txt
            web/public/data/sitemap-data*.json
