name: Watch Master Data

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual run

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Update Master Data Version
        run: |
          mkdir -p data
          curl -sS --fail --retry 5 \
            "https://metadata.exmeaning.com/jp/versions/current_version.json" \
            -o /tmp/current_version.json
          python3 - <<'PY'
          import json

          with open("/tmp/current_version.json", "r", encoding="utf-8") as f:
              version = json.load(f)

          data_version = version.get("dataVersion")
          if not data_version:
              raise SystemExit("current_version.json does not contain dataVersion")

          with open("data/master_version.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write(str(data_version) + "\n")
          PY

      - name: Generate Sitemap Data
        run: |
          GITHUB_BASE="https://raw.githubusercontent.com/Team-Haruki/haruki-sekai-master/main/master"
          MASTER_DATA_URLS_JP="$GITHUB_BASE,https://metadata.exmeaning.com/jp/master,https://metadata.pjsk.moe/jp/master" \
          REQUIRE_FRESH_BUILD_DATA=1 \
          npm run sitemap --prefix web

          python3 -c "import json; json.load(open('web/public/data/sitemap-data.jp.json'))"

      - name: Commit & Push Changes
        run: |
          if [[ -n $(git status --porcelain data/master_version.txt web/public/data/sitemap-data*.json) ]]; then
            echo "Changes detected in master data version or sitemap data."

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f data/master_version.txt web/public/data/sitemap-data*.json
            git commit -m "chore: update master data version and sitemap"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in master data version or sitemap data."
          fi
