name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Scan committed content for secrets and local configuration
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/scan-committed-secrets.mjs
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l main.go internal)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./... -count=1
      - name: Race test
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: go build -o "$RUNNER_TEMP/moesekai-server" main.go
      - name: Validate startup script
        run: test -x scripts/start-container.sh && sh -n scripts/start-container.sh
      - name: Validate backend image
        run: docker build -f Dockerfile.backend -t moesekai-backend:test .

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Characterization tests
        run: node --test tests/characterization/*.test.mjs
      - name: Validate synthetic HTTPS fixture behavior
        working-directory: ${{ github.workspace }}
        run: node --test scripts/serve-public-lyrics-build-contract.test.mjs
      - name: Validate i18n
        run: npm run lint:i18n
      - name: Validate i18n usage
        run: npm run lint:i18n-usage
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build:next
      - name: Check localized SSR links
        run: node scripts/check-localized-link-ssr.mjs
      - name: Validate production image build contract
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          fixture_pid=""
          builder_name="public-build-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            if [[ -n "$fixture_pid" ]]; then
              kill "$fixture_pid" 2>/dev/null || true
              for _ in {1..40}; do
                kill -0 "$fixture_pid" 2>/dev/null || break
                sleep 0.05
              done
              kill -KILL "$fixture_pid" 2>/dev/null || true
              wait "$fixture_pid" 2>/dev/null || true
            fi
            docker buildx rm --force "$builder_name" >/dev/null 2>&1 || true
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$fixture_dir/key.pem" \
            -out "$fixture_dir/cert.pem" \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:host.docker.internal,DNS:localhost,IP:127.0.0.1"
          node scripts/serve-public-lyrics-build-contract.mjs \
            --cert "$fixture_dir/cert.pem" \
            --host 0.0.0.0 \
            --key "$fixture_dir/key.pem" \
            --port-file "$fixture_dir/port" &
          fixture_pid=$!
          for _ in {1..100}; do
            [[ -s "$fixture_dir/port" ]] && break
            kill -0 "$fixture_pid"
            sleep 0.05
          done
          test -s "$fixture_dir/port"
          fixture_port="$(cat "$fixture_dir/port")"
          lyrics_base_url="https://localhost:${fixture_port}/files/translation/lyrics"
          curl --fail --silent --show-error \
            --connect-timeout 3 \
            --max-time 10 \
            --cacert "$fixture_dir/cert.pem" \
            "https://127.0.0.1:${fixture_port}/files/translation/lyrics/index.json" \
            | node -e 'let body=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const value = JSON.parse(body); const song = value.songs?.[0]; if (value.version !== 3 || value.songs?.length !== 1 || song?.musicId !== 10 || song?.state !== "complete" || song?.availableVersions?.join(",") !== "full") process.exit(1); });'
          docker buildx create \
            --name "$builder_name" \
            --driver docker-container \
            --driver-opt network=host \
            --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --allow network.host \
            --network host \
            --secret id=public_lyrics_ca,src="$fixture_dir/cert.pem" \
            --build-arg NEXT_PUBLIC_LYRICS_BASE_URL="$lyrics_base_url" \
            --load \
            -f Dockerfile -t moesekai:test .

  calculator:
    name: Calculator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: refer/re_sekai-calculator
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: refer/re_sekai-calculator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test all suites
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical development-tooling advisories
        run: npm audit --audit-level=critical
