name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Validate backend image
        run: docker build -f Dockerfile.backend -t moesekai-backend:test .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Characterization tests
        run: node --test tests/characterization/*.test.mjs
      - name: Validate i18n
        run: npm run lint:i18n
      - name: Validate i18n usage
        run: npm run lint:i18n-usage
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build:next
      - name: Validate production image
        working-directory: ${{ github.workspace }}
        run: docker build -f Dockerfile -t moesekai:test .

  calculator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: refer/re_sekai-calculator
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: refer/re_sekai-calculator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test all suites
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high
