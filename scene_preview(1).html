<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySekai 场景实时预览</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87b7d6; }
    #app { width: 100%; height: 100%; position: relative; }
    #hud {
      position: absolute; left: 12px; top: 46px; z-index: 10;
      background: rgba(20, 24, 30, 0.75); color: #e8f0ff; padding: 10px 12px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 8px; max-width: 360px;
    }
    #hud.hidden { display: none; }
    #hudToggleBtn {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 11;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #3b4f69;
      background: rgba(20, 24, 30, 0.8);
      color: #e8f0ff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .action-row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    #hud input, #hud button, #hud select {
      font-size: 12px; margin-top: 4px; margin-right: 6px;
      background: #1f2a3a; color: #e8f0ff; border: 1px solid #3b4f69; border-radius: 4px;
      padding: 4px 6px;
    }
    #status { margin-top: 8px; color: #9bc3ff; white-space: pre-wrap; }
    #axesView {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 120px;
      height: 120px;
      border-radius: 8px;
      background: rgba(20, 24, 30, 0.22);
      border: 1px solid rgba(155, 195, 255, 0.35);
      overflow: hidden;
      z-index: 9;
    }
    .axis-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font: 700 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      user-select: none;
    }
    .axis-label.x { color: #ff8a8a; }
    .axis-label.y { color: #97ff97; }
    .axis-label.z { color: #8fc6ff; }
  </style>
</head>
<body>
  <div id="app">
    <button id="hudToggleBtn" title="显示/隐藏界面">▴</button>
    <div id="hud">
      <div><strong>MySekai 场景预览</strong></div>
      <div>布局文件:
        <input id="layoutPath" value="./layout2.json" size="24" />
      </div>
      <div>场景:
        <select id="siteId">
          <option value="1" selected>户外</option>
          <option value="2">1F</option>
          <option value="3">2F</option>
          <option value="4">3F</option>
        </select>
      </div>
      <div style="margin-top:6px;">
        <label><input id="debugToggle" type="checkbox" /> 调试</label>
        <label><input id="gridToggle" type="checkbox" checked /> 网格</label>
        <label><input id="shadowToggle" type="checkbox" checked /> 阴影</label>
      </div>
      <div style="margin-top:6px;">
        <label for="backWallOpacity">背面不透明度:</label>
        <input id="backWallOpacity" type="range" min="0" max="100" step="1" value="20" />
        <span id="backWallOpacityValue">20%</span>
      </div>
      <div class="action-row">
        <button id="reloadBtn">重新读取</button>
        <button id="resetCameraBtn">重置相机</button>
      </div>
      <div id="status">初始化中...</div>
      <div>左键旋转/右键移动/滚轮缩放</div>
    </div>
    <div id="axesView">
      <div class="axis-label x" id="axisLabelX">X</div>
      <div class="axis-label y" id="axisLabelY">Y</div>
      <div class="axis-label z" id="axisLabelZ">Z</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.162.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.162.0/examples/jsm/controls/OrbitControls.js";
    import { OBJLoader } from "https://unpkg.com/three@0.162.0/examples/jsm/loaders/OBJLoader.js";

    // 基础路径
    const ASSETS_ROOT = "./data/assets";
    const MASTER_DATA_ROOT = "./data/master_data";
    const FIXTURE_ROOT = `${ASSETS_ROOT}/mysekai/fixture`;
    const CUSTOM_FIXTURE_ATTACH_ROOT = `${ASSETS_ROOT}/mysekai/custom_fixture_attach`;
    const ROOM_SKIN_ROOT = `${ASSETS_ROOT}/mysekai/site/field/my_room_asset/skin`;
    const OUTDOOR_GRASS_TEX = `${ASSETS_ROOT}/mysekai/site/field/grasslands/texture/tex_site_base_grasslands_grass01.png`;
    const FIXTURES_MASTER = `${MASTER_DATA_ROOT}/mysekaiFixtures.json`;
    const CUSTOM_FIXTURES_MASTER = `${MASTER_DATA_ROOT}/mysekaiCustomFixtures.json`;
    const CARDS_MASTER = `${MASTER_DATA_ROOT}/cards.json`;
    const MYSEKAI_MUSIC_RECORDS_MASTER = `${MASTER_DATA_ROOT}/mysekaiMusicRecords.json`;
    const MUSICS_MASTER = `${MASTER_DATA_ROOT}/musics.json`;
    const RANK_RELEASES = `${MASTER_DATA_ROOT}/mysekaiRankReleases.json`;
    const SITE_LEVELS = `${MASTER_DATA_ROOT}/mysekaiSiteLevels.json`;
    const SITE_LAYOUTS = `${MASTER_DATA_ROOT}/mysekaiSiteLayouts.json`;
    const GLOBAL_SCALE = 4.0; 

    const app = document.getElementById("app");
    const hudEl = document.getElementById("hud");
    const hudToggleBtn = document.getElementById("hudToggleBtn");
    const statusEl = document.getElementById("status");
    const layoutPathEl = document.getElementById("layoutPath");
    const siteIdEl = document.getElementById("siteId");
    const reloadBtn = document.getElementById("reloadBtn");
    const resetCameraBtn = document.getElementById("resetCameraBtn");
    const axesView = document.getElementById("axesView");
    const debugToggleEl = document.getElementById("debugToggle");
    const gridToggleEl = document.getElementById("gridToggle");
    const shadowToggleEl = document.getElementById("shadowToggle");
    const backWallOpacityEl = document.getElementById("backWallOpacity");
    const backWallOpacityValueEl = document.getElementById("backWallOpacityValue");
    const axisLabelX = document.getElementById("axisLabelX");
    const axisLabelY = document.getElementById("axisLabelY");
    const axisLabelZ = document.getElementById("axisLabelZ");
    const STORAGE_KEY = "mysekai_scene_preview_options_v1";

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      logarithmicDepthBuffer: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(app.clientWidth, app.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    app.appendChild(renderer.domElement);

    const axesRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    axesRenderer.setSize(axesView.clientWidth, axesView.clientHeight);
    axesRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    axesView.appendChild(axesRenderer.domElement);

    const scene = new THREE.Scene();
    function createSkyGradientBackground() {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0.00, "#5ea8ff");
      grad.addColorStop(0.38, "#8fc8ff");
      grad.addColorStop(0.72, "#c6e6ff");
      grad.addColorStop(1.00, "#eef7ff");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    scene.background = createSkyGradientBackground();

    const camera = new THREE.PerspectiveCamera(55, app.clientWidth / app.clientHeight, 0.1, 1200);
    camera.position.set(60, 45, 60);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.enableZoom = true;
    controls.minDistance = 0.05; // 仅把最近距离调得更近

    const keyState = { w: false, s: false, a: false, d: false, space: false, shift: false };
    function moveCameraRig(offset) {
      camera.position.add(offset);
      controls.target.add(offset);
      controls.update();
    }
    window.addEventListener("keydown", (ev) => {
      const k = String(ev.key || "").toLowerCase();
      if (k === "w" || k === "s" || k === "a" || k === "d") keyState[k] = true;
      if (ev.code === "Space") keyState.space = true;
      if (ev.code === "ShiftLeft" || ev.code === "ShiftRight") keyState.shift = true;
    });
    window.addEventListener("keyup", (ev) => {
      const k = String(ev.key || "").toLowerCase();
      if (k === "w" || k === "s" || k === "a" || k === "d") keyState[k] = false;
      if (ev.code === "Space") keyState.space = false;
      if (ev.code === "ShiftLeft" || ev.code === "ShiftRight") keyState.shift = false;
    });

    const axesScene = new THREE.Scene();
    const axesCamera = new THREE.PerspectiveCamera(50, axesView.clientWidth / axesView.clientHeight, 0.1, 10);
    const miniAxesHelper = new THREE.AxesHelper(1.2);
    axesScene.add(miniAxesHelper);

    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(50, 120, 30);
    scene.add(dir);

    const LIGHTING_PRESETS = {
      indoor: { ambient: 2.0, directional: 1.0 },
      outdoor: { ambient: 1.2, directional: 1.6 }
    };

    function applyLightingPreset(isOutdoor) {
      const p = isOutdoor ? LIGHTING_PRESETS.outdoor : LIGHTING_PRESETS.indoor;
      ambientLight.intensity = p.ambient;
      dir.intensity = p.directional;
    }

    const grass = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0x8fb77a, side: THREE.DoubleSide })
    );
    grass.rotation.x = -Math.PI * 0.5;
    grass.visible = false;
    scene.add(grass);

    let gridMinor = null;
    let gridMajor = null;
    const indoorWallPlanes = [];
    const indoorWallPlaneByType = new Map();
    let indoorWallGridMinor = null;
    let indoorWallGridMajor = null;
    const wallPlacedEntries = [];
    let indoorDoorObject = null;
    let currentSiteId = 1;
    let backWallOpacityRatio = Number(backWallOpacityEl.value || 20) / 100;
    let backFacingOpacityDirty = true;
    const lastBackFacingCamPos = new THREE.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
    const lastBackFacingCamQuat = new THREE.Quaternion();
    let lastBackFacingOpacityRatio = Number.NaN;
    let lastBackFacingSiteId = Number.NaN;
    let debugEnabled = false;
    let gridEnabled = true;
    let shadowEnabled = true;
    let hudVisible = true;

    const originMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 14, 10),
      new THREE.MeshBasicMaterial({
        color: 0xff3b30,
        transparent: true,
        opacity: 0.95
      })
    );
    originMarker.position.set(0, 0, 0);
    scene.add(originMarker);

    const contentGroup = new THREE.Group();
    scene.add(contentGroup);

    const texLoader = new THREE.TextureLoader();
    const objLoader = new OBJLoader();

    const fixtureMetaMap = new Map();
    const customFixtureMetaMap = new Map();
    const objCache = new Map();
    const objStatsCache = new Map();
    const objMeshNameHitCache = new Map();
    const textureCache = new Map();
    const dirListCache = new Map();
    const cardAssetById = new Map();
    let cardsLoaded = false;
    const externalMusicIdByMysekaiMusicRecordId = new Map();
    const musicAssetById = new Map();
    let musicDataLoaded = false;
    let rankReleases = [];
    let siteLevels = [];
    let siteLayouts = [];
    let restoredCameraState = false;

    function setStatus(text) { statusEl.textContent = text; }

    function vec3ToArray(v) {
      return [Number(v.x), Number(v.y), Number(v.z)];
    }

    function getAlwaysEnabledLayoutTypes() {
      return ["floor", "rug", "road", "wall_left", "wall_right", "wall_front", "wall_back"];
    }

    function isFiniteVec3Array(v) {
      return Array.isArray(v) && v.length === 3 && v.every((n) => Number.isFinite(n));
    }

    function applyCameraStateFromStorage(v) {
      if (!v || !isFiniteVec3Array(v.cameraPos) || !isFiniteVec3Array(v.controlsTarget)) return;
      camera.position.fromArray(v.cameraPos);
      controls.target.fromArray(v.controlsTarget);
      if (isFiniteVec3Array(v.cameraUp)) camera.up.fromArray(v.cameraUp);
      controls.update();
      restoredCameraState = true;
    }

    function loadOptionsFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const v = JSON.parse(raw);
        if (typeof v.layoutPath === "string") layoutPathEl.value = v.layoutPath;
        if (typeof v.siteId === "string") siteIdEl.value = v.siteId;
        // 旧版本 layoutTypes 配置已废弃（现固定绘制全部类型）
        if (typeof v.debugEnabled === "boolean") {
          debugEnabled = v.debugEnabled;
          debugToggleEl.checked = v.debugEnabled;
        }
        if (typeof v.gridEnabled === "boolean") {
          gridEnabled = v.gridEnabled;
          gridToggleEl.checked = v.gridEnabled;
        }
        if (typeof v.shadowEnabled === "boolean") {
          shadowEnabled = v.shadowEnabled;
          shadowToggleEl.checked = v.shadowEnabled;
        }
        if (typeof v.hudVisible === "boolean") {
          hudVisible = v.hudVisible;
        }
        if (Number.isFinite(Number(v.backWallOpacityPercent))) {
          const pct = Math.max(0, Math.min(100, Number(v.backWallOpacityPercent)));
          backWallOpacityEl.value = String(pct);
          backWallOpacityValueEl.textContent = `${pct}%`;
          backWallOpacityRatio = pct / 100;
        }
        applyCameraStateFromStorage(v);
      } catch (_) {}
    }

    function saveOptionsToStorage() {
      const v = {
        layoutPath: layoutPathEl.value,
        siteId: siteIdEl.value,
        layoutTypes: getAlwaysEnabledLayoutTypes().join(","),
        debugEnabled: !!debugToggleEl.checked,
        gridEnabled: !!gridToggleEl.checked,
        shadowEnabled: !!shadowToggleEl.checked,
        hudVisible,
        backWallOpacityPercent: Number(backWallOpacityEl.value || 30),
        cameraPos: vec3ToArray(camera.position),
        controlsTarget: vec3ToArray(controls.target),
        cameraUp: vec3ToArray(camera.up)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(v));
    }

    function applyHudVisibility() {
      hudEl.classList.toggle("hidden", !hudVisible);
      hudToggleBtn.textContent = hudVisible ? "▴" : "▾";
      hudToggleBtn.title = hudVisible ? "隐藏界面" : "显示界面";
    }

    async function loadJson(path, options = {}) {
      const url = options.forceFresh
        ? `${path}${path.includes("?") ? "&" : "?"}_ts=${Date.now()}`
        : path;
      const res = await fetch(url, options.forceFresh ? { cache: "no-store" } : undefined);
      if (!res.ok) throw new Error(`加载失败: ${path}`);
      return res.json();
    }

    async function fetchText(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`加载失败: ${path}`);
      return res.text();
    }

    async function listDirectoryFiles(dirPath, suffix = "") {
      const key = `${dirPath}|${suffix}`;
      if (dirListCache.has(key)) return dirListCache.get(key);
      try {
        const html = await fetchText(dirPath.endsWith("/") ? dirPath : `${dirPath}/`);
        const matches = [...html.matchAll(/href="([^"]+)"/g)].map((m) => m[1]);
        const files = matches
          .filter((h) => h && !h.startsWith("?") && h !== "../" && !h.endsWith("/"))
          .map((h) => decodeURIComponent(h));
        const out = suffix ? files.filter((f) => f.toLowerCase().endsWith(suffix.toLowerCase())) : files;
        dirListCache.set(key, out);
        return out;
      } catch (_) {
        dirListCache.set(key, []);
        return [];
      }
    }

    async function listAssetFiles(assetName, subdir, ext, rootDir = FIXTURE_ROOT) {
      // 浏览器端无法直接列目录，按常见命名尝试探测
      const candidates = [];
      if (subdir === "fbx") {
        const fbxDir = `${rootDir}/${assetName}/fbx/`;
        const modelDir = `${rootDir}/${assetName}/model/`;
        let dir = fbxDir;
        let listed = await listDirectoryFiles(fbxDir, ".obj");
        if (!listed.length) {
          dir = modelDir;
          listed = await listDirectoryFiles(modelDir, ".obj");
        }
        if (listed.length) {
          // canonical first
          listed.sort((a, b) => {
            if (a === `${assetName}.obj`) return -1;
            if (b === `${assetName}.obj`) return 1;
            return a.length - b.length || a.localeCompare(b);
          });
          for (const fn of listed) candidates.push(`${dir}${fn}`);
        } else {
          candidates.push(`${rootDir}/${assetName}/fbx/${assetName}.obj`);
          candidates.push(`${rootDir}/${assetName}/model/${assetName}.obj`);
        }
      } else if (subdir === "texture") {
        for (let i = 1; i <= 6; i++) candidates.push(`${rootDir}/${assetName}/texture/tex_${assetName.replace("mdl_", "")}_${i}.${ext}`);
      }
      return candidates;
    }

    async function firstExisting(paths) {
      for (const p of paths) {
        try {
          const r = await fetch(p, { method: "HEAD" });
          if (r.ok) return p;
        } catch (_) {}
      }
      return null;
    }

    async function pickShortestTexturePath(rootDir, assetName) {
      const texDir = `${rootDir}/${assetName}/texture/`;
      const files = await listDirectoryFiles(texDir);
      const texFiles = (files || [])
        .filter((f) => /^tex_/i.test(f))
        .filter((f) => /\.(png|jpg|jpeg|webp)$/i.test(f))
        .sort((a, b) => a.length - b.length || a.localeCompare(b));
      if (!texFiles.length) return null;
      return `${texDir}${texFiles[0]}`;
    }

    async function getObjGroup(objPath) {
      if (objCache.has(objPath)) return objCache.get(objPath).clone(true);
      const txt = await fetchText(objPath);
      const grp = objLoader.parse(txt);
      objCache.set(objPath, grp);
      return grp.clone(true);
    }

    function isShadowObjPath(p) {
      const name = String(p || "").toLowerCase();
      return name.includes("shadow") || name.includes("_sdw") || name.includes("kage");
    }

    async function getObjStats(objPath) {
      if (objStatsCache.has(objPath)) return objStatsCache.get(objPath);
      const grp = await getObjGroup(objPath);
      const box = new THREE.Box3().setFromObject(grp);
      const size = new THREE.Vector3();
      box.getSize(size);
      let vertexCount = 0;
      grp.traverse((m) => {
        if (!m.isMesh || !m.geometry?.attributes?.position) return;
        vertexCount += Number(m.geometry.attributes.position.count || 0);
      });
      const stats = {
        path: objPath,
        volume: Math.max(0, size.x) * Math.max(0, size.y) * Math.max(0, size.z),
        vertexCount
      };
      objStatsCache.set(objPath, stats);
      return stats;
    }

    async function hasMeshNameContainingAsset(objPath, assetName) {
      const assetLower = String(assetName || "").toLowerCase();
      if (!assetLower) return false;
      const key = `${objPath}|${assetLower}`;
      if (objMeshNameHitCache.has(key)) return objMeshNameHitCache.get(key);
      const grp = await getObjGroup(objPath);
      let hit = false;
      grp.traverse((m) => {
        if (hit || !m?.isMesh) return;
        const n = String(m.name || "").toLowerCase();
        if (n.includes(assetLower)) hit = true;
      });
      objMeshNameHitCache.set(key, hit);
      return hit;
    }

    async function pickPrimaryObjPath(objPaths, assetName = "") {
      const filtered = objPaths.filter((p) => !isShadowObjPath(p));
      const candidates = filtered.length ? filtered : objPaths;
      if (!candidates.length) return null;

      let preferred = candidates;
      if (assetName) {
        const meshNameMatched = [];
        for (const p of candidates) {
          if (await hasMeshNameContainingAsset(p, assetName)) meshNameMatched.push(p);
        }
        if (meshNameMatched.length) preferred = meshNameMatched;
      }

      const scored = [];
      for (const p of preferred) scored.push(await getObjStats(p));

      scored.sort((a, b) => {
        const dv = b.volume - a.volume;
        if (Math.abs(dv) > 1e-6) return dv;
        const dc = b.vertexCount - a.vertexCount;
        if (dc !== 0) return dc;
        return a.path.localeCompare(b.path);
      });

      return scored[0].path;
    }

    function cloneWithMaterial(obj, materialFactory) {
      const out = obj.clone(true);
      out.traverse((m) => {
        if (!m.isMesh) return;
        m.geometry = m.geometry.clone();
        m.material = materialFactory();
      });
      return out;
    }

    function getDollSizeValue(sizeName) {
      if (sizeName === "small") return 0.8;
      if (sizeName === "medium") return 1.1;
      if (sizeName === "large") return 2.0;
      return null;
    }

    function parseDollSizeFromName(name) {
      const s = String(name || "").toLowerCase();
      // 目标资产命名：mdl_pas{x}_fixture_doll{x}{small|medium|large}
      const m = s.match(/mdl_pas\d+_fixture_doll\d+(small|medium|large)/);
      return m ? m[1] : null;
    }

    function applyDollFixtureSizeCorrection(obj, assetName) {
      const targetSize = parseDollSizeFromName(assetName);
      if (!targetSize) return;

      // 从实际网格名推断“当前尺寸”，按顶点数加权投票，避免混杂子网格误判。
      const weighted = { small: 0, medium: 0, large: 0 };
      obj.traverse((m) => {
        if (!m?.isMesh || !m.geometry?.attributes?.position) return;
        const detected = parseDollSizeFromName(m.name);
        if (!detected) return;
        weighted[detected] += Number(m.geometry.attributes.position.count || 0);
      });
      let sourceSize = null;
      let best = 0;
      for (const k of ["small", "medium", "large"]) {
        if (weighted[k] > best) {
          best = weighted[k];
          sourceSize = k;
        }
      }

      if (!sourceSize || sourceSize === targetSize) return;

      const srcVal = getDollSizeValue(sourceSize);
      const tgtVal = getDollSizeValue(targetSize);
      if (!(srcVal > 0 && tgtVal > 0)) return;
      const s = tgtVal / srcVal;
      obj.scale.multiplyScalar(s);
    }

    function computeXZSize(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const sz = new THREE.Vector3();
      box.getSize(sz);
      return { x: sz.x, z: sz.z };
    }

    function modPos(v, m) {
      return ((v % m) + m) % m;
    }

    function applyIndoorFloorUV(geometry, worldMatrix, siteSize) {
      // 纹理先分成 7x7，每小块映射到地面 4x4 格（格长=场景网格单位）。
      // 因此一整轮纹理在地面上的周期是 28x28 格；并以场地左下角作为锚点对齐。
      const period = 28;
      const halfW = Number(siteSize?.width || 80) / 2;
      const halfD = Number(siteSize?.depth || 80) / 2;
      const pos = geometry.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(worldMatrix);
        const gx = v.x + halfW;
        const gz = v.z + halfD;
        uv[i * 2 + 0] = -modPos(gx + 2, period) / period;
        uv[i * 2 + 1] = modPos(gz + 4, period) / period;
      }
      geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }

    function applyOutdoorFloorUV(geometry, worldMatrix, siteSize) {
      // 户外：整张纹理对应 8x8 场景区域，以场地左下角为锚点循环。
      const period = 8;
      const halfW = Number(siteSize?.width || 80) / 2;
      const halfD = Number(siteSize?.depth || 80) / 2;
      const pos = geometry.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(worldMatrix);
        const gx = v.x + halfW;
        const gz = v.z + halfD;
        // 使用连续 UV + RepeatWrapping，避免单面片上 mod 分段造成的插值失真。
        uv[i * 2 + 0] = gx / period;
        uv[i * 2 + 1] = gz / period;
      }
      geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }

    function applyIndoorWallUV(wallMesh) {
      // 墙纸取上半部分；横向 6 条，每条覆盖 宽4x高12 区域。
      const g = wallMesh.geometry;
      const pos = g.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      const wallWidth = Number(wallMesh.scale.x || 1);
      const wallHeight = Number(wallMesh.scale.y || 1);
      const wallType = String(wallMesh.userData?.wallType || "");

      const is_left_right = wallType === "wall_left" || wallType === "wall_right";
      const is_front_back = !is_left_right;

      for (let i = 0; i < pos.count; i++) {
        const lx = pos.getX(i); // [-0.5, 0.5]
        const ly = pos.getY(i); // [-0.5, 0.5]
        const alongBase = (lx + 0.5) * wallWidth;
        const along = is_front_back ? (wallWidth - alongBase) : alongBase + 2;
        let up = ly + 0.5;
        if (is_left_right)
            up += 1.2;
        up *= wallHeight;

        const u = (along + 0.375) / 24.75;
        const v = 0.5 + (((up + 1.15) / 12) * 0.5);

        uv[i * 2 + 0] = u;
        uv[i * 2 + 1] = v;
        if (is_front_back) uv[i * 2 + 0] = -uv[i * 2 + 0];

      }
      g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }

    function inferFencePartRole(group) {
          /** 根据 OBJ「g …」载入后的节点名推断栅栏部件：`post` | `short` | `long` */
      const names = [];
      group.traverse((o) => {
        if (o.name) names.push(String(o.name).toLowerCase());
      });
      const blob = names.join(" ");
      if (blob.includes("wing_long")) return "long";
      if (blob.includes("wing_short")) return "short";
      if (blob.includes("pole_center") || blob.includes("mdl_pole")) return "post";
      return null;
    }

    function locateObject(obj, x, z, y, w, d, h, rotationYRad, layoutType) {
      // 0）模型放大 GLOBAL_SCALE 倍
      // 0.5) 模型绕自身旋转 180 度
      // 1) x0 = x + (dOdd ? 0.5 : 1), z0 = z - (wOdd ? 0.5 : 1)
      // 2) 将模型放置到 (x0, y, z0) 的位置
      // 3) x1 = x0 + 0.5 if (wOdd != dOdd && w > d) else x0
      //    z1 = z0 - 0.5 if (wOdd != dOdd && w > d) else z0
      // 4) 将模型绕世界坐标 (x1, 0, z1) 上的Y轴旋转 rotationYRad 度
      const wn = Number(w);
      const dn = Number(d);
      const wOdd = wn % 2 === 1;
      const dOdd = dn % 2 === 1;

      let x0 = Number(x);
      let z0 = Number(z);
      let x1 = x0;
      let z1 = z0;

      if (!layoutType.startsWith("wall_")) {
        // 地面类型
        x0 += (wOdd ? 0.5 : 1.0);
        z0 -= (dOdd ? 0.5 : 1.0);

        x1 = Number(x0);
        z1 = Number(z0);
        if (wOdd != dOdd) {
          if (w > d) z1 -= 0.5;
          else x1 += 0.5;
        }
      }
      else {
        // 墙类型
        w = Math.max(w, d);
        if (w % 2 == 1) {
          if      (layoutType === "wall_back")  x0 -= 0.5;
          else if (layoutType === "wall_front") x0 += 0.5;
          else if (layoutType === "wall_left")  z0 += 0.5;
          else if (layoutType === "wall_right") z0 -= 0.5;
        }
        x1 = Number(x0);
        z1 = Number(z0);
      }

      obj.scale.setScalar(GLOBAL_SCALE * obj.scale.x);
      obj.rotateY(Math.PI);
      obj.position.set(x0, Number(y), z0);

      const angle = rotationYRad;
      const pivotRotate = new THREE.Matrix4()
        .makeTranslation(x1, 0, z1)
        .multiply(new THREE.Matrix4().makeRotationY(angle))
        .multiply(new THREE.Matrix4().makeTranslation(-x1, 0, -z1));
      obj.applyMatrix4(pivotRotate);

      obj.updateMatrixWorld(true);
      return obj;
    }

    function worldDirToLocal(dx, dz, rotDeg) {
      let x = dx, z = dz;
      const rot = ((Math.round(rotDeg / 90) % 4) + 4) % 4;
      for (let i = 0; i < rot; i++) {
        const nx = -z;
        const nz = x;
        x = nx; z = nz;
      }
      if (x > 0) return "+x";
      if (x < 0) return "-x";
      if (z > 0) return "+z";
      return "-z";
    }

    function mapLayoutToScenePos(p) {
      // Align to game-like axis: flip Z direction.
      return { x: Number(p.x || 0), y: Number(p.y || 0), z: -Number(p.z || 0) };
    }

    function mapLayoutToSceneRotDeg(rotDeg) {
      // When Z axis is flipped, yaw sign should also flip.
      return -Number(rotDeg || 0);
    }

    function getXZCellKeysFromBBox(bbox) {
      const minX = Math.floor(bbox.min.x + 0.5);
      const maxX = Math.ceil(bbox.max.x + 0.5);
      const minZ = Math.floor(bbox.min.z + 0.5);
      const maxZ = Math.ceil(bbox.max.z + 0.5);
      const keys = [];
      for (let x = minX; x < maxX; x++) {
        for (let z = minZ; z < maxZ; z++) {
          keys.push(`${x},${z}`);
        }
      }
      return keys;
    }

    function captureWorldBBox(obj) {
      obj.updateMatrixWorld(true);
      return new THREE.Box3().setFromObject(obj);
    }

    function calcBBoxXZAreaOverlayRatio(a, b) {
      // a b 是 3d BBox ，仅计算XZ上的面积相交比例
      const minX = Math.max(a.min.x, b.min.x);
      const maxX = Math.min(a.max.x, b.max.x);
      const minZ = Math.max(a.min.z, b.min.z);
      const maxZ = Math.min(a.max.z, b.max.z);
      if (minX > maxX || minZ > maxZ) return 0;
      const areaA = (a.max.x - a.min.x) * (a.max.z - a.min.z);
      const areaB = (b.max.x - b.min.x) * (b.max.z - b.min.z);
      const denom = Math.min(areaA, areaB);
      if (!(denom > 1e-12)) return 0;
      return ((maxX - minX) * (maxZ - minZ)) / denom;
    }

    function applyFloorStacking(floorRecords, applyToCustom) {
      if (!floorRecords.length) return;

      if (applyToCustom) {
        let baseRecords = floorRecords.filter((r) => r.customPartType == "base");
        let ornamentRecords = floorRecords.filter((r) => r.customPartType == "ornament");
        floorRecords = [...baseRecords, ...ornamentRecords];
      }
      else {
        floorRecords.sort((a, b) => a.bottomY - b.bottomY);
      }
      
      const cellMap = new Map();
      const eps = 0.001;

      const addRecordToCells = (rec) => {
        for (const key of rec.cellKeys) {
          if (!cellMap.has(key)) cellMap.set(key, []);
          cellMap.get(key).push(rec);
        }
      };

      for (const rec of floorRecords) {
        let supportTop = null;

        for (const key of rec.cellKeys) {
          const belowList = cellMap.get(key);
          if (!belowList || !belowList.length) continue;

          for (const b of belowList) {
            if (b === rec) continue;
            if (
                (!applyToCustom && b.topY - eps  < rec.bottomY && b.customPartType === null)
             || (applyToCustom && b.customPartType == "base" && rec.customPartType == "ornament")
            ) {
              if (calcBBoxXZAreaOverlayRatio(rec.bbox, b.bbox) < 0.8) {
                 continue;
              }
              if (supportTop === null || b.topY > supportTop) {
                supportTop = b.topY;
              }
            }
          }
          break;
        }

        if (supportTop !== null && (applyToCustom || supportTop <= rec.bottomY)) {
          const dy = supportTop - rec.bottomY;
          rec.object.position.y += dy;
          rec.bbox = captureWorldBBox(rec.object);
          rec.bottomY = rec.bbox.min.y;
          rec.topY = rec.bbox.max.y;
        }

        addRecordToCells(rec);
      }
    }

    function yawFromBaseToTarget(baseDir, targetDir) {
      const order = ["+x", "-z", "-x", "+z"];
      return ((order.indexOf(targetDir) - order.indexOf(baseDir)) * Math.PI) / 2;
    }

    function makeGrid(minX, maxX, minZ, maxZ) {
      if (gridMinor) {
        scene.remove(gridMinor);
        gridMinor.geometry.dispose();
        gridMinor.material.dispose();
      }
      if (gridMajor) {
        scene.remove(gridMajor);
        gridMajor.geometry.dispose();
        gridMajor.material.dispose();
      }
      const minorVerts = [];
      const majorVerts = [];
      const y = 0.01;
      const xStart = Math.floor(minX);
      const xEnd = Math.ceil(maxX);
      const zStart = Math.floor(minZ);
      const zEnd = Math.ceil(maxZ);

      const isMajorX = (v) => Math.abs((v - minX) % 4) < 1e-6;
      const isMajorZ = (v) => Math.abs((v - minZ) % 4) < 1e-6;

      for (let x = xStart; x <= xEnd; x++) {
        const target = isMajorX(x) ? majorVerts : minorVerts;
        target.push(x, y, zStart, x, y, zEnd);
      }
      for (let z = zStart; z <= zEnd; z++) {
        const target = isMajorZ(z) ? majorVerts : minorVerts;
        target.push(xStart, y, z, xEnd, y, z);
      }

      const minorG = new THREE.BufferGeometry();
      minorG.setAttribute("position", new THREE.Float32BufferAttribute(minorVerts, 3));
      const minorM = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.5
      });
      gridMinor = new THREE.LineSegments(minorG, minorM);
      scene.add(gridMinor);

      const majorG = new THREE.BufferGeometry();
      majorG.setAttribute("position", new THREE.Float32BufferAttribute(majorVerts, 3));
      const majorM = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.8
      });
      gridMajor = new THREE.LineSegments(majorG, majorM);
      scene.add(gridMajor);
    }

    function ensureIndoorWallPlanes() {
      if (indoorWallPlanes.length) return;
      const mat = new THREE.MeshBasicMaterial({ color: 0xd0d0d0, side: THREE.DoubleSide, transparent: false, opacity: 1.0 });
      const wallTypes = ["wall_left", "wall_right", "wall_back", "wall_front"];
      for (let i = 0; i < wallTypes.length; i++) {
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat.clone());
        wall.userData.wallType = wallTypes[i];
        wall.visible = false;
        indoorWallPlanes.push(wall);
        indoorWallPlaneByType.set(wallTypes[i], wall);
        scene.add(wall);
      }
    }

    function clearIndoorWallGrids() {
      if (indoorWallGridMinor) {
        scene.remove(indoorWallGridMinor);
        indoorWallGridMinor.geometry.dispose();
        indoorWallGridMinor.material.dispose();
        indoorWallGridMinor = null;
      }
      if (indoorWallGridMajor) {
        scene.remove(indoorWallGridMajor);
        indoorWallGridMajor.geometry.dispose();
        indoorWallGridMajor.material.dispose();
        indoorWallGridMajor = null;
      }
    }

    function updateIndoorWallsAndGrid(siteSize) {
      ensureIndoorWallPlanes();
      clearIndoorWallGrids();

      const w = Number(siteSize.width || 80);
      const d = Number(siteSize.depth || 80);
      const h = Number(siteSize.height || 10);
      const halfW = w / 2;
      const halfD = d / 2;

      // left wall
      indoorWallPlanes[0].scale.set(d, h, 1);
      indoorWallPlanes[0].position.set(-halfW, h / 2, 0);
      indoorWallPlanes[0].rotation.set(0, Math.PI / 2, 0);
      indoorWallPlanes[0].visible = true;
      // right wall
      indoorWallPlanes[1].scale.set(d, h, 1);
      indoorWallPlanes[1].position.set(halfW, h / 2, 0);
      indoorWallPlanes[1].rotation.set(0, -Math.PI / 2, 0);
      indoorWallPlanes[1].visible = true;
      // back wall
      indoorWallPlanes[2].scale.set(w, h, 1);
      indoorWallPlanes[2].position.set(0, h / 2, -halfD);
      indoorWallPlanes[2].rotation.set(0, 0, 0);
      indoorWallPlanes[2].visible = true;
      // front wall
      indoorWallPlanes[3].scale.set(w, h, 1);
      indoorWallPlanes[3].position.set(0, h / 2, halfD);
      indoorWallPlanes[3].rotation.set(0, Math.PI, 0);
      indoorWallPlanes[3].visible = true;

      const minorVerts = [];
      const majorVerts = [];
      const pushLine = (arr, x0, y0, z0, x1, y1, z1) => {
        arr.push(x0, y0, z0, x1, y1, z1);
      };
      const pick = (v) => (v % 4 === 0 ? majorVerts : minorVerts);

      for (let x = -halfW; x <= halfW; x += 1) {
        const tgt = pick(Math.round(x));
        pushLine(tgt, x, 0, -halfD, x, h, -halfD);
        pushLine(tgt, x, 0, halfD, x, h, halfD);
      }
      for (let z = -halfD; z <= halfD; z += 1) {
        const tgt = pick(Math.round(z));
        pushLine(tgt, -halfW, 0, z, -halfW, h, z);
        pushLine(tgt, halfW, 0, z, halfW, h, z);
      }
      for (let y = 0; y <= h; y += 1) {
        const tgt = pick(y);
        pushLine(tgt, -halfW, y, -halfD, halfW, y, -halfD);
        pushLine(tgt, -halfW, y, halfD, halfW, y, halfD);
        pushLine(tgt, -halfW, y, -halfD, -halfW, y, halfD);
        pushLine(tgt, halfW, y, -halfD, halfW, y, halfD);
      }

      const minorG = new THREE.BufferGeometry();
      minorG.setAttribute("position", new THREE.Float32BufferAttribute(minorVerts, 3));
      const minorM = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
      indoorWallGridMinor = new THREE.LineSegments(minorG, minorM);
      scene.add(indoorWallGridMinor);

      const majorG = new THREE.BufferGeometry();
      majorG.setAttribute("position", new THREE.Float32BufferAttribute(majorVerts, 3));
      const majorM = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.68 });
      indoorWallGridMajor = new THREE.LineSegments(majorG, majorM);
      scene.add(indoorWallGridMajor);
    }

    function hideIndoorWallsAndGrid() {
      for (const wall of indoorWallPlanes) wall.visible = false;
      clearIndoorWallGrids();
      if (indoorDoorObject) {
        contentGroup.remove(indoorDoorObject);
        indoorDoorObject.traverse((o) => {
          if (o.geometry) o.geometry.dispose?.();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose?.());
            else o.material.dispose?.();
          }
        });
        indoorDoorObject = null;
      }
    }

    function applyDebugVisibility() {
      originMarker.visible = debugEnabled;
      axesView.style.display = debugEnabled ? "block" : "none";
      if (gridMinor) gridMinor.visible = gridEnabled;
      if (gridMajor) gridMajor.visible = gridEnabled;
      if (indoorWallGridMinor) indoorWallGridMinor.visible = gridEnabled;
      if (indoorWallGridMajor) indoorWallGridMajor.visible = gridEnabled;
    }

    function applyShadowVisibility() {
      contentGroup.traverse((o) => {
        if (o.userData?.isFloorShadow) o.visible = shadowEnabled;
      });
    }

    function markBackFacingOpacityDirty() {
      backFacingOpacityDirty = true;
    }

    function ensureOrderedDither(material) {
      if (!material || material.userData._orderedDitherReady) return;
      material.userData._orderedDitherReady = true;
      material.userData._orderedDitherOpacity = 1.0;
      material.userData._orderedDitherPhaseX = 0.0;
      material.userData._orderedDitherPhaseY = 0.0;
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uDitherOpacity = { value: material.userData._orderedDitherOpacity ?? 1.0 };
        shader.uniforms.uDitherPhase = {
          value: new THREE.Vector2(
            material.userData._orderedDitherPhaseX ?? 0.0,
            material.userData._orderedDitherPhaseY ?? 0.0
          )
        };
        material.userData._orderedDitherShader = shader;
        shader.fragmentShader = shader.fragmentShader
          .replace(
            "#include <common>",
            `#include <common>
             uniform float uDitherOpacity;
             uniform vec2 uDitherPhase;
             float bayer4(vec2 p){
               int x = int(mod(p.x, 4.0));
               int y = int(mod(p.y, 4.0));
               int idx = y * 4 + x;
               float t = 0.0;
               if (idx == 0) t = 0.0; else if (idx == 1) t = 8.0; else if (idx == 2) t = 2.0; else if (idx == 3) t = 10.0;
               else if (idx == 4) t = 12.0; else if (idx == 5) t = 4.0; else if (idx == 6) t = 14.0; else if (idx == 7) t = 6.0;
               else if (idx == 8) t = 3.0; else if (idx == 9) t = 11.0; else if (idx == 10) t = 1.0; else if (idx == 11) t = 9.0;
               else if (idx == 12) t = 15.0; else if (idx == 13) t = 7.0; else if (idx == 14) t = 13.0; else t = 5.0;
               return (t + 0.5) / 16.0;
             }`
          )
          .replace(
            "#include <dithering_fragment>",
            `
             float _op = clamp(uDitherOpacity, 0.0, 1.0);
             if (_op < 0.999) {
               float th = bayer4(gl_FragCoord.xy + uDitherPhase);
               if (_op < th) discard;
             }
             #include <dithering_fragment>`
          );
      };
      material.needsUpdate = true;
    }

    function setOrderedDitherOpacity(material, opacity, phaseX = 0.0, phaseY = 0.0) {
      if (!material) return;
      ensureOrderedDither(material);
      const op = Math.max(0, Math.min(1, Number(opacity ?? 1)));
      material.userData._orderedDitherOpacity = op;
      material.userData._orderedDitherPhaseX = Number(phaseX || 0);
      material.userData._orderedDitherPhaseY = Number(phaseY || 0);
      const shader = material.userData._orderedDitherShader;
      if (shader?.uniforms?.uDitherOpacity) shader.uniforms.uDitherOpacity.value = op;
      if (shader?.uniforms?.uDitherPhase) shader.uniforms.uDitherPhase.value.set(
        material.userData._orderedDitherPhaseX,
        material.userData._orderedDitherPhaseY
      );
      material.transparent = false;
      material.alphaHash = false;
      // Ordered dither should keep standard opaque depth behavior.
      material.depthWrite = true;
      material.depthTest = true;
      material.needsUpdate = true;
    }

    function applyBackFacingOpacity() {
      if (Number(currentSiteId) === 1) return;
      const sameState =
        lastBackFacingCamPos.distanceToSquared(camera.position) < 1e-10 &&
        (1.0 - Math.abs(lastBackFacingCamQuat.dot(camera.quaternion))) < 1e-10 &&
        Math.abs(lastBackFacingOpacityRatio - backWallOpacityRatio) < 1e-10 &&
        Number(lastBackFacingSiteId) === Number(currentSiteId);
      if (!backFacingOpacityDirty && sameState) return;
      backFacingOpacityDirty = false;
      lastBackFacingCamPos.copy(camera.position);
      lastBackFacingCamQuat.copy(camera.quaternion);
      lastBackFacingOpacityRatio = backWallOpacityRatio;
      lastBackFacingSiteId = Number(currentSiteId);
      const cameraPos = camera.position.clone();
      const wallBackFacing = new Map();

      for (const wall of indoorWallPlanes) {
        if (!wall.visible) continue;
        const wallType = wall.userData.wallType;
        const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(wall.quaternion).normalize();
        const toCamera = cameraPos.clone().sub(wall.position).normalize();
        const isBackFacing = normal.dot(toCamera) < 0;
        wallBackFacing.set(wallType, isBackFacing);
        const targetOpacity = isBackFacing ? backWallOpacityRatio : 1.0;
        // Keep wall on base phase.
        setOrderedDitherOpacity(wall.material, targetOpacity, 0.0, 0.0);
      }

      let ditherIdx = 0;
      for (const entry of wallPlacedEntries) {
        const isBackFacing = !!wallBackFacing.get(entry.layoutType);
        const wallOpacity = isBackFacing ? backWallOpacityRatio : 1.0;
        // 规则：墙上家具不透明度 = min(1, 墙不透明度 * 2)
        const targetOpacity = Math.min(1.0, wallOpacity * 2.0);
        // Stable phase offsets in a 4x4 cell to avoid wall/furniture mask lock-step overlap.
        const px = ditherIdx % 4;
        const py = Math.floor(ditherIdx / 4) % 4;
        ditherIdx++;
        for (const mat of entry.materials) {
          mat.alphaTest = targetOpacity < 0.999 ? 0.0 : (mat.userData._baseAlphaTest ?? mat.alphaTest);
          setOrderedDitherOpacity(mat, targetOpacity, px, py);
        }
      }

      // 室内门跟随 wall_front 的半透明规则
      if (indoorDoorObject) {
        const frontIsBackFacing = !!wallBackFacing.get("wall_front");
        const frontWallOpacity = frontIsBackFacing ? backWallOpacityRatio : 1.0;
        const doorOpacity = Math.min(1.0, frontWallOpacity * 2.0);
        indoorDoorObject.traverse((m) => {
          if (!m.isMesh || !m.material) return;
          const mats = Array.isArray(m.material) ? m.material : [m.material];
          for (const mat of mats) {
            if (mat?.userData && mat.userData._baseAlphaTest === undefined) mat.userData._baseAlphaTest = mat.alphaTest ?? 0;
            mat.alphaTest = doorOpacity < 0.999 ? 0.0 : (mat.userData._baseAlphaTest ?? mat.alphaTest);
            setOrderedDitherOpacity(mat, doorOpacity, 1.0, 1.0);
          }
        });
      }
    }

    function updateAxesLabels() {
      if (!debugEnabled) return;
      const width = axesView.clientWidth;
      const height = axesView.clientHeight;
      const radius = 1.25;
      const points = [

        { v: new THREE.Vector3(0, 0, radius), el: axisLabelZ }

        const projected = p.v.clone().project(axesCamera);

        const y = ((-projected.y + 1) * 0.5) * height;

    async function getTexture(texPath) {
      if (!texPath) return null;
      if (textureCache.has(texPath)) return textureCache.get(texPath);
      const tex = await new Promise((resolve, reject) => {
        texLoader.load(texPath, resolve, undefined, reject);
      });
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      textureCache.set(texPath, tex);
      return tex;
    }

    let floorShadowTexture = null;

    function getFloorShadowTexture() {
      if (floorShadowTexture) return floorShadowTexture;
      const canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const img = ctx.createImageData(w, h);
      const data = img.data;
      const halfW = w * 0.5;
      const halfH = h * 0.5;
      const rectHalfW = 28.0;
      const rectHalfH = 22.0;
      const feather = 18.0;
      const maxAlpha = 0.32;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const px = Math.abs((x + 0.5) - halfW) - rectHalfW;
          const py = Math.abs((y + 0.5) - halfH) - rectHalfH;
          const ox = Math.max(px, 0.0);
          const oy = Math.max(py, 0.0);
          const outsideDist = Math.hypot(ox, oy);
          const insideDist = Math.min(Math.max(px, py), 0.0);
          const sd = outsideDist + insideDist;
          const t = 1.0 - Math.min(Math.max(sd / feather, 0.0), 1.0);
          const alpha = t * maxAlpha;
          const idx = (y * w + x) * 4;
          data[idx + 0] = 0;
          data[idx + 1] = 0;
          data[idx + 2] = 0;
          data[idx + 3] = Math.round(alpha * 255);
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      floorShadowTexture = tex;
      return floorShadowTexture;
    }

    function createFakeFloorShadowForObject(placedObj, siteSize) {
      const SHADOW_Y_OFFSET = 0.07; // 高于 road(0.01)/rug(0.02)，减少深度冲突
      const bbox = captureWorldBBox(placedObj);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const cx = (bbox.min.x + bbox.max.x) * 0.5;
      const cz = (bbox.min.z + bbox.max.z) * 0.5;
      const sx = Math.max(0.8, size.x * 1.18);
      const sz = Math.max(0.8, size.z * 1.18);
      const area = sx * sz;
      const opacity = area <= 3.2 ? 0.28 : 0.55; // 小面积进一步变浅
      const halfW = Number(siteSize?.width || 80) * 0.5;
      const halfD = Number(siteSize?.depth || 80) * 0.5;
      const xMin = Math.max(cx - sx * 0.5, -halfW);
      const xMax = Math.min(cx + sx * 0.5, halfW);
      const zMin = Math.max(cz - sz * 0.5, -halfD);
      const zMax = Math.min(cz + sz * 0.5, halfD);
      const clippedW = xMax - xMin;
      const clippedD = zMax - zMin;
      if (!(clippedW > 0.05 && clippedD > 0.05)) return null;
      const clippedCx = (xMin + xMax) * 0.5;
      const clippedCz = (zMin + zMax) * 0.5;

      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({
          map: getFloorShadowTexture(),
          color: 0x000000,
          transparent: true,
          opacity,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        })
      );
      shadow.rotation.set(-Math.PI * 0.5, 0, 0, "YXZ");
      shadow.scale.set(clippedW, clippedD, 1);
      shadow.position.set(clippedCx, SHADOW_Y_OFFSET, clippedCz);
      shadow.visible = shadowEnabled;
      shadow.userData.isFloorShadow = true;
      shadow.renderOrder = -1;
      return shadow;
    }

    function pickLikelyCustomDisplayMesh(root) {
      const candidates = [];
      root.traverse((m) => {
        if (!m?.isMesh || !m.geometry) return;
        const name = String(m.name || "").toLowerCase();
        if (name.includes("preview")) return;
        candidates.push({ mesh: m, name });
      });

      const predefinedNames = [
        "mdl_cst0006_photo_type1stand1_0"
      ];
      for (const name of predefinedNames) {
        const candidate = candidates.find((c) => c.name.includes(name));
        if (candidate) {
          return candidate.mesh;
        }
      }
      
      candidates.sort((a, b) => {
        if (a.name < b.name) return 1;
        if (a.name > b.name) return -1;
        return 0;
      });
      return candidates.length ? candidates[0].mesh : null;
    }

    function cloneCustomWithDisplayTexture(obj, baseMatFactory, displayTex) {
      const out = obj.clone(true);

        // NOTE: custom 家具自定义贴图替换入口（统一走目标网格选择函数）。

    }

    function applyRoadWorldUV(geometry, worldMatrix) {
      const pos = geometry.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(worldMatrix);
        uv[i * 2 + 0] = v.x * 0.5;
        uv[i * 2 + 1] = v.z * 0.5;
      }
      geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }

    function getSiteLevelIdByRank(mysekaiRank, siteId) {
      const unlockedLevelIds = new Set(
        rankReleases
          .filter((r) => r.mysekaiRankRelaseType === "mysekai_site_level" && Number(r.mysekaiRank) <= Number(mysekaiRank))
          .map((r) => Number(r.externalId))
      );
      const candidates = siteLevels
        .filter((s) => Number(s.mysekaiSiteId) === Number(siteId) && unlockedLevelIds.has(Number(s.id)))
        .sort((a, b) => Number(b.level || 0) - Number(a.level || 0));
      return candidates.length ? Number(candidates[0].id) : null;
    }

    function getSiteSize(siteLevelId) {
      if (!siteLevelId) return { width: 80, depth: 80 };
      const floor = siteLayouts.find(
        (l) => Number(l.mysekaiSiteLevelId) === Number(siteLevelId) && l.mysekaiLayoutType === "floor"
      );
      if (!floor) return { width: 80, depth: 80 };
      return { width: Number(floor.width || 80), depth: Number(floor.depth || 80), height: Number(floor.height || 10) };
    }

    function extractEntries(layoutData, layoutTypes, siteId) {
      // 户外按用户选择；室内固定绘制 floor/rug + 四面墙。
      const effectiveTypes = Number(siteId) === 1
        ? layoutTypes
        : ["floor", "rug", "wall_left", "wall_right", "wall_front", "wall_back"];
      const wanted = new Set(effectiveTypes);
      const entries = [];
      const customArrays = [
        "mysekaiCustomFixtureCollections",
        "mysekaiCustomFixturePenlights",
        "mysekaiCustomFixtureHonors",
        "mysekaiCustomFixtureBondsHonors",
        "mysekaiCustomFixtureRecordJackets",
        "mysekaiCustomFixturePhotos"
      ];
      const pushGroupEntries = (grp) => {
        const layoutType = grp?.mysekaiLayoutType;
        if (!wanted.has(layoutType)) return;
        for (const it of grp.mysekaiFixtures || []) entries.push({ layoutType, item: it });
        // 新增：mysekaiCanvases 与 mysekaiFixtures 一样参与绘制。
        for (const it of grp.mysekaiCanvases || []) entries.push({ layoutType, item: it });
        // 新增：mysekaiGrowingPlants 按普通 floor 家具流程渲染（无特殊机制）。
        for (const it of grp.mysekaiGrowingPlants || []) entries.push({ layoutType, item: { ...it, __isGrowingPlant: true } });
        for (const key of customArrays) {
          for (const it of grp[key] || []) {
            entries.push({ layoutType, item: { ...it, __isCustomFixture: true, __customGroupKey: key } });
          }
        }
      };

      // layout2 format
      if (layoutData && Array.isArray(layoutData.userMysekaiSiteHousingLayouts)) {
        const site = layoutData.userMysekaiSiteHousingLayouts.find((s) => Number(s.mysekaiSiteId) === Number(siteId));
        if (!site) return { entries, playerRank: Number(layoutData.mysekaiRank || 1) };
        for (const grp of site.mysekaiSiteHousingLayouts || []) {
          pushGroupEntries(grp);
        }
        return { entries, playerRank: Number(layoutData.mysekaiRank || 1), effectiveTypes };
      }

      // old layout format
      if (Array.isArray(layoutData)) {
        for (const grp of layoutData) {
          pushGroupEntries(grp);
        }
      }
      return { entries, playerRank: 1, effectiveTypes };
    }

    async function buildScene(layoutPath, layoutTypes, siteId, options = {}) {
      clearContent();
      clearFloorWallsAndGridsBeforeBuild();
      wallPlacedEntries.length = 0;
      currentSiteId = Number(siteId || 1);
      const floorPlacementRecords = [];
      const floorShadowRecords = [];
      setStatus("加载 layout...");
      const layout = await loadJson(layoutPath, { forceFresh: !!options.forceFreshLayout });
      const gateId = Number(layout?.userMysekaiGate?.mysekaiGateId || 1);
      const gateAssetById = {
        1: "mdl_non0006_gate_lon1",
        2: "mdl_non0006_gate_mmj1",
        3: "mdl_non0006_gate_vbs1",
        4: "mdl_non0006_gate_wns1",
        5: "mdl_non0006_gate_nig1"
      };
      const { entries, playerRank, effectiveTypes } = extractEntries(layout, layoutTypes, siteId);
      const siteLevelId = getSiteLevelIdByRank(playerRank, siteId);
      const siteSize = getSiteSize(siteLevelId);
      if (!siteLevelId) {
        setStatus(`场景未解锁: siteId=${siteId}, rank=${playerRank}`);
        return;
      }

      function mapWallLayoutToScenePos(layoutType, layoutPos, size) {
        const halfW = Number(size.width || 80) / 2;
        const halfD = Number(size.depth || 80) / 2;
        const px = Number(layoutPos.x || 0);
        const py = Number(layoutPos.y || 0);

        const wall_eps = 0.01

        if (layoutType === "wall_back") {
          return { x: px + 1, y: py, z: -halfD + wall_eps };
        }
        if (layoutType === "wall_front") {
          return { x: -px - 1, y: py, z: halfD - wall_eps };
        }
        if (layoutType === "wall_left") {
          return { x: -halfW + wall_eps, y: py, z: -px - 1 };
        }
        if (layoutType === "wall_right") {
          return { x: halfW - wall_eps, y: py, z: px + 1 };
        }
        return mapLayoutToScenePos(layoutPos);
      }

      function getIndoorSurfaceAppearance(layoutData, sid) {
        const out = { floor: null, wall: null };
        const list = layoutData?.userMysekaiSiteHousingLayouts;
        if (!Array.isArray(list)) return out;
        const site = list.find((s) => Number(s.mysekaiSiteId) === Number(sid));
        if (!site) return out;
        const arr = Array.isArray(site.mysekaiFixtureSurfaceAppearances) ? site.mysekaiFixtureSurfaceAppearances : [];
        for (const it of arr) {
          if (it?.mysekaiFixtureSurfaceAppearanceType === "floor_appearance") out.floor = it;
          else if (it?.mysekaiFixtureSurfaceAppearanceType === "wall_appearance") out.wall = it;
        }
        return out;
      }

    async function getRoomSkinAssetInfo(fixtureId, textureId, kind) {
      const meta = fixtureMetaMap.get(Number(fixtureId));
      const asset = meta?.assetbundleName;
      if (!asset) return null;
      const base = `${ROOM_SKIN_ROOT}/${asset}`;
      const buildUvsetCandidates = (prefix, texId) => {
        const out = [];
        for (let uv = 1; uv <= 4; uv++) {
          out.push(`${base}/texture/tex_${asset}_${prefix}_uvset${uv}_${texId}.png`);
        }
        for (let uv = 1; uv <= 4; uv++) {
          out.push(`${base}/texture/tex_${asset}_${prefix}_uvset${uv}_1.png`);
        }
        return out;
      };
      if (kind === "floor") {
          const tex = await firstExisting(buildUvsetCandidates("floor_floor1", textureId));
          return { asset, base, floorTexPath: tex };
      }
      if (kind === "wall") {
          const wallTex = await firstExisting(buildUvsetCandidates("wall_wall1", textureId));
          const doorTex = await firstExisting([
            `${base}/texture/tex_${asset}_door_door1_${textureId}.png`,
            `${base}/texture/tex_${asset}_door_door1_1.png`
          ]);
          const doorObjs = (await listDirectoryFiles(`${base}/fbx/`, ".obj"))
            .filter((fn) => fn.toLowerCase().includes("door"))
            .map((fn) => `${base}/fbx/${fn}`);
          return { asset, base, wallTexPath: wallTex, doorTexPath: doorTex, doorObjPaths: doorObjs };
        }
        return null;
      }

      const fencePointsByFixture = new Map();
      for (const { item } of entries) {
        if (item?.__isCustomFixture) continue;
        const fid = Number(item.mysekaiFixtureId);
        const meta = fixtureMetaMap.get(fid);
        if (!meta || meta.mysekaiFixtureHandleType !== "fence") continue;
        const p = mapLayoutToScenePos(item.position || { x: 0, z: 0 });
        if (!fencePointsByFixture.has(fid)) fencePointsByFixture.set(fid, new Set());
        fencePointsByFixture.get(fid).add(`${Math.round(p.x)},${Math.round(p.z)}`);
      }

      let minX = Infinity, minZ = Infinity, maxX = -Infinity, maxZ = -Infinity;
      let loaded = 0;
      const fenceAssetPartCache = new Map();
      for (const { layoutType, item } of entries) {
        const entryGroup = new THREE.Group();
        const addEntryNode = (node) => { if (node) entryGroup.add(node); };
        const wallPlacedStart = wallPlacedEntries.length;
        const floorPlacementStart = floorPlacementRecords.length;
        const floorShadowStart = floorShadowRecords.length;
        try {
        const isCustom = !!item?.__isCustomFixture;
        const fid = Number(item.mysekaiFixtureId);
        const customFixtureId = Number(item.mysekaiCustomFixtureId);
        const meta = isCustom ? null : fixtureMetaMap.get(fid);
        const cmeta = isCustom ? customFixtureMetaMap.get(customFixtureId) : null;
        if (!isCustom && meta?.mysekaiFixtureHandleType === "block_transparent") {
          continue;
        }

        const renderAssets = [];
        if (isCustom) {
          if (!cmeta) continue;
          if (cmeta.baseAssetBundleName) renderAssets.push({ asset: cmeta.baseAssetBundleName, isOrnament: false });
          if (cmeta.ornamentAssetBundleName) renderAssets.push({ asset: cmeta.ornamentAssetBundleName, isOrnament: true });
          if (!renderAssets.length) continue;
        } else {
          const assetFromGate = fid === 900002 ? gateAssetById[gateId] : null;
          const asset = assetFromGate || meta?.assetbundleName;
          if (!asset) continue;
          renderAssets.push({ asset, isOrnament: false });
        }

        const p = mapWallLayoutToScenePos(layoutType, item.position || { x: 0, y: 0, z: 0 }, siteSize);
        minX = Math.min(minX, p.x); minZ = Math.min(minZ, p.z);
        maxX = Math.max(maxX, p.x); maxZ = Math.max(maxZ, p.z);

        let eps_y = 0.0;
        if (layoutType === "road")        eps_y = 0.01;
        else if (layoutType === "rug")    eps_y = 0.02;
        else if (layoutType === "floor")  eps_y = 0.03;

        const baseGridW = isCustom ? Number(cmeta.width || 1) : Number(meta.gridSize?.width || 1);
        const baseGridD = isCustom ? Number(cmeta.depth || 1) : Number(meta.gridSize?.depth || 1);
        const baseGridH = isCustom ? Number(cmeta.height || 1) : Number(meta.gridSize?.height || 1);
        const baseRotDeg = mapLayoutToSceneRotDeg(item.rotation || 0);
        const baseRotY = baseRotDeg * Math.PI / 180;

        let placedForShadow = null;
        const customPlacedPartsForStack = [];
        const customEntryRoot = isCustom ? new THREE.Group() : null;
        let customHasPlacedChild = false;
        for (const assetInfo of renderAssets) {
          const asset = assetInfo.asset;
          const assetRoot = (isCustom && assetInfo.isOrnament) ? CUSTOM_FIXTURE_ATTACH_ROOT : FIXTURE_ROOT;
          const objPaths = await listAssetFiles(asset, "fbx", "obj", assetRoot);
          if (!objPaths.length) throw new Error(`模型缺失: ${assetRoot}/${asset}/fbx/*.obj`);

          const texId = Number(item.textureId || 1);
          let texPath = await firstExisting([
            `${assetRoot}/${asset}/texture/tex_${asset.replace("mdl_", "")}_${texId}.png`,
            `${assetRoot}/${asset}/texture/tex_${asset.replace("mdl_", "")}_1.png`,
            `${assetRoot}/${asset}/texture/tex_${asset.replace("mdl_", "")}_main.png`,
            `${assetRoot}/${asset}/texture/tex_${asset.replace("mdl_", "")}_common.png`
          ]);
          if (!texPath) texPath = await pickShortestTexturePath(assetRoot, asset);
          const map = await getTexture(texPath);

          const makeMat = () => new THREE.MeshLambertMaterial({
              map: map || null,
              color: 0xffffff,
              side: THREE.FrontSide,
              transparent: layoutType !== "road",
              alphaTest: layoutType === "road" ? 0.0 : 0.5,
              polygonOffset: layoutType === "road",
              polygonOffsetFactor: layoutType === "road" ? -1 : 0,
              polygonOffsetUnits: layoutType === "road" ? -1 : 0
            });

          let obj = null;
          if (!isCustom && meta.mysekaiFixtureHandleType === "fence" && objPaths.length > 1) {
          if (!fenceAssetPartCache.has(asset)) {
            const parts = [];
            for (const pth of objPaths) parts.push(await getObjGroup(pth));
            const scored = parts.map((g) => ({
              group: g,
              role: inferFencePartRole(g),
              ...computeXZSize(g)
            }));
            let post = scored.find((s) => s.role === "post")?.group;
            let beamShort = scored.find((s) => s.role === "short")?.group;
            let beamLong = scored.find((s) => s.role === "long")?.group;

            const unassigned = scored.filter((s) => !s.role);
            if (!post && unassigned.length) {
              unassigned.sort((a, b) => Math.abs(a.x - a.z) - Math.abs(b.x - b.z));
              post = unassigned[0].group;
            }

            const wingCandidates = scored
              .filter((s) => s.group !== post)
              .filter((s) => s.role === "short" || s.role === "long" || !s.role);

            wingCandidates.sort((a, b) =>
              Math.max(a.x, a.z) - Math.max(b.x, b.z));

            const uniqueWings = [];
            const seen = new Set();
            for (const s of wingCandidates) {
              if (seen.has(s.group)) continue;
              seen.add(s.group);
              uniqueWings.push(s);
            }

            if (!beamShort && uniqueWings.length >= 2) beamShort = uniqueWings[0].group;
            if (!beamLong && uniqueWings.length >= 2) beamLong = uniqueWings[uniqueWings.length - 1].group;
            if (!beamShort && uniqueWings.length === 1) beamShort = uniqueWings[0].group;
            if (!beamLong && uniqueWings.length === 1) beamLong = uniqueWings[0].group;

            if (!post && scored.length) post = scored[0].group;
            beamShort ||= beamLong;
            beamLong ||= beamShort;

            fenceAssetPartCache.set(asset, {
              post,
              beamShort,
              beamLong,
              baseDir: "-x"
            });
          }
          const fp = fenceAssetPartCache.get(asset);
          
          const ix = Math.round(p.x), iz = Math.round(p.z);
          const set = fencePointsByFixture.get(fid) || new Set();
          const links = [];
          for (const step of [1, 2]) {
            if (set.has(`${ix - step},${iz}`)) links.push([-step, 0]);
            if (set.has(`${ix + step},${iz}`)) links.push([step, 0]);
            if (set.has(`${ix},${iz - step}`)) links.push([0, -step]);
            if (set.has(`${ix},${iz + step}`)) links.push([0, step]);
          }

          // post 作为当前家具本体；beam 作为独立家具单独放置（统一走 locateObject）。
          obj = cloneWithMaterial(fp.post, makeMat);
          for (const [dx, dz] of links) {
            // 只在正方向生成，避免相邻两根 fence 重复画同一根 beam。
            if (!(dx > 0 || (dx === 0 && dz > 0))) continue;
            const step = Math.max(Math.abs(dx), Math.abs(dz));
            const beamSrc =
              step <= 1
                ? (fp.beamShort || fp.beamLong)
                : (fp.beamLong || fp.beamShort);

            const dirWorld =
              dx > 0 ? "+x" :
              dx < 0 ? "-x" :
              dz > 0 ? "+z" : "-z";
            const yaw = yawFromBaseToTarget(fp.baseDir, dirWorld);
            const beamMidX = p.x + dx;
            const beamMidZ = p.z + dz;
            const beamObj = cloneWithMaterial(beamSrc, makeMat);
            const placedBeam = locateObject(
              beamObj,
              beamMidX,
              beamMidZ,
              p.y + eps_y,
              2,
              2,
              1,
              yaw,
              layoutType,
            );
            placedBeam.updateMatrixWorld(true);
            addEntryNode(placedBeam);
          }
          } else {
            // 非 fence 家具：仅加载主部件（体量最大，若接近则顶点最多）。
            const primaryObjPath = await pickPrimaryObjPath(objPaths, asset);
            if (!primaryObjPath) throw new Error(`无法确定主模型: ${asset}`);
            const srcObj = await getObjGroup(primaryObjPath);
            if (!isCustom && isCanvasFixtureId(fid)) {
              const cardTex = await getCanvasCardTexture(item, fid);
              obj = cloneCanvasWithCardMaterial(srcObj, makeMat, cardTex, fid);
            } else if (isCustom) {
              let displayTex = null;
              if (customFixtureId === 55 && assetInfo.isOrnament) {
                displayTex = await getRecordJacketTexture(item);
              } else {
                displayTex = createFallbackLightGrayTexture();
              }
              // 所有 custom 家具都经过 pickLikelyCustomDisplayMesh（包括曲封家具）。
              obj = cloneCustomWithDisplayTexture(srcObj, makeMat, displayTex);
            } else {
              obj = cloneWithMaterial(srcObj, makeMat);
            }
          }

          // 先把模型改成 min-corner 锚点，再由外层组应用布局变换。
          applyDollFixtureSizeCorrection(obj, asset);
          let rotY = baseRotY;
          if (isCustom && assetInfo.isOrnament) {
            rotY += mapLayoutToSceneRotDeg(item.ornamentRotation || 0) * Math.PI / 180;
          }
          const gridW = baseGridW;
          const gridD = baseGridD;
          const gridH = baseGridH;

          // 直接在 obj 本体上完成放置与绕世界 pivot 旋转。
          const placed = locateObject(
            obj,
            p.x,
            p.z,
            p.y + eps_y,
            gridW,
            gridD,
            gridH,
            rotY,
            layoutType
          );
          placed.updateMatrixWorld(true);
          if (isCustom) {
            placed.traverse((m) => {
              if (!m.isMesh) return;
              const n = String(m.name || "").toLowerCase();
              if (n.includes("preview")) m.visible = false;
            });
          }

          if (layoutType === "road") {
            placed.traverse((m) => {
              if (!m.isMesh) return;
              applyRoadWorldUV(m.geometry, m.matrixWorld);
            });
          }

          if (isCustom) {
            placed.userData.isCustomPart = true;
            placed.userData.customPartType = assetInfo.isOrnament ? "ornament" : "base";
            customEntryRoot.add(placed);
            customHasPlacedChild = true;
            customPlacedPartsForStack.push(placed);
          } else {
            addEntryNode(placed);
            placedForShadow ||= placed;
          }

          if (layoutType.startsWith("wall_")) {
            const mats = [];
            placed.traverse((m) => {
              if (!m.isMesh || !m.material) return;
              if (Array.isArray(m.material)) {
                for (const mm of m.material) {
                  if (mm?.userData && mm.userData._baseAlphaTest === undefined) mm.userData._baseAlphaTest = mm.alphaTest ?? 0;
                  mats.push(mm);
                }
              } else {
                if (m.material?.userData && m.material.userData._baseAlphaTest === undefined) m.material.userData._baseAlphaTest = m.material.alphaTest ?? 0;
                mats.push(m.material);
              }
            });
            wallPlacedEntries.push({ layoutType, object: placed, materials: mats });
          }
        }

        if (isCustom && customHasPlacedChild) {
          customEntryRoot.updateMatrixWorld(true);
          addEntryNode(customEntryRoot);
          placedForShadow = customEntryRoot;
        }

        if (layoutType === "floor") {
          const stackObjects = isCustom
            ? customPlacedPartsForStack
            : (placedForShadow ? [placedForShadow] : []);
          for (const stackObj of stackObjects) {
            const bbox = captureWorldBBox(stackObj);
            floorPlacementRecords.push({
              object: stackObj,
              layoutType: layoutType,
              bbox: bbox,
              bottomY: bbox.min.y,
              topY: bbox.max.y,
              gridY: p.y,
              cellKeys: getXZCellKeysFromBBox(bbox),
              customPartType: stackObj.userData?.customPartType || null
            });
          }

          if (placedForShadow) {
            const isGroundPlacedByLayout = Math.abs(Number(item?.position?.y || 0)) < 1e-6;
            if (isGroundPlacedByLayout) {
              const shadow = createFakeFloorShadowForObject(placedForShadow, siteSize);
              if (shadow) {
                addEntryNode(shadow);
                floorShadowRecords.push({ object: placedForShadow, shadow });
              }
            }
          }
        }

        if (entryGroup.children.length) contentGroup.add(entryGroup);
        loaded++;
        if (loaded % 30 === 0) setStatus(`加载中... ${loaded}/${entries.length}`);
        } catch (e) {
          wallPlacedEntries.length = wallPlacedStart;
          floorPlacementRecords.length = floorPlacementStart;
          floorShadowRecords.length = floorShadowStart;
          console.log("[fixture-load-skip]", {
            layoutType,
            mysekaiFixtureId: Number(item?.mysekaiFixtureId || 0),
            mysekaiCustomFixtureId: Number(item?.mysekaiCustomFixtureId || 0),
            position: item?.position || null,
            error: e?.message || String(e)
          });
          continue;
        }
      }

      applyFloorStacking(floorPlacementRecords, false);
      applyFloorStacking(floorPlacementRecords, true);
      for (const rec of floorShadowRecords) {
        const bbox = captureWorldBBox(rec.object);
        // 仅保留“最终直接落在地面”的阴影。
        if (Math.abs(bbox.min.y) > 0.06) {
          contentGroup.remove(rec.shadow);
          continue;
        }
      }
      applyShadowVisibility();

      const halfW = siteSize.width / 2;
      const halfD = siteSize.depth / 2;
      minX = -halfW; maxX = halfW;
      minZ = -halfD; maxZ = halfD;
      const w = siteSize.width;
      const d = siteSize.depth;
      applyLightingPreset(Number(siteId) === 1);
      grass.scale.set(w, d, 1);
      grass.position.set(0, 0, 0);
      grass.visible = true;
      if (Number(siteId) === 1) {
        const outdoorTex = await getTexture(OUTDOOR_GRASS_TEX).catch(() => null);
        if (outdoorTex) {
          outdoorTex.wrapS = outdoorTex.wrapT = THREE.RepeatWrapping;
          grass.material.map = outdoorTex;
          grass.material.color.set(0xffffff);
          grass.material.needsUpdate = true;
          grass.updateMatrixWorld(true);
          applyOutdoorFloorUV(grass.geometry, grass.matrixWorld, siteSize);
        } else {
          grass.material.map = null;
          grass.material.color.set(0x8fb77a);
          grass.material.needsUpdate = true;
        }
        hideIndoorWallsAndGrid();
      } else {
        updateIndoorWallsAndGrid(siteSize);
        const appearance = getIndoorSurfaceAppearance(layout, siteId);
        const floorSkin = appearance.floor
          ? await getRoomSkinAssetInfo(appearance.floor.mysekaiFixtureId, appearance.floor.textureId, "floor")
          : null;
        const wallSkin = appearance.wall
          ? await getRoomSkinAssetInfo(appearance.wall.mysekaiFixtureId, appearance.wall.textureId, "wall")
          : null;

        if (floorSkin?.floorTexPath) {
          const floorTex = await getTexture(floorSkin.floorTexPath);
          if (floorTex) {
            floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
            grass.material.map = floorTex;
            grass.material.color.set(0xffffff);
            grass.material.needsUpdate = true;
            grass.updateMatrixWorld(true);
            applyIndoorFloorUV(grass.geometry, grass.matrixWorld, siteSize);
          }
        } else {
          grass.material.map = null;
          grass.material.color.set(0x8fb77a);
          grass.material.needsUpdate = true;
        }

        if (wallSkin?.wallTexPath) {
          const wallTex = await getTexture(wallSkin.wallTexPath);
          if (wallTex) {
            wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
            for (const wall of indoorWallPlanes) {
              wall.material.map = wallTex;
              wall.material.color.set(0xffffff);
              wall.material.needsUpdate = true;
              applyIndoorWallUV(wall);
            }
          }
        } else {
          for (const wall of indoorWallPlanes) {
            wall.material.map = null;
            wall.material.color.set(0xd0d0d0);
            wall.material.needsUpdate = true;
          }
        }

        if (indoorDoorObject) {
          contentGroup.remove(indoorDoorObject);
          indoorDoorObject.traverse((o) => {
            if (o.geometry) o.geometry.dispose?.();
            if (o.material) {
              if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose?.());
              else o.material.dispose?.();
            }
          });
          indoorDoorObject = null;
        }
        if (wallSkin?.doorObjPaths?.length) {
          const doorObjPath = await pickPrimaryObjPath(wallSkin.doorObjPaths, wallSkin.asset);
          if (doorObjPath) {
            const doorTex = wallSkin.doorTexPath ? await getTexture(wallSkin.doorTexPath) : null;
            const doorMatFactory = () => new THREE.MeshLambertMaterial({
              map: doorTex || null,
              color: 0xffffff,
              side: THREE.FrontSide,
              transparent: true,
              alphaTest: 0.5
            });
            const doorObj = cloneWithMaterial(await getObjGroup(doorObjPath), doorMatFactory);
            const doorPlaced = locateObject(
              doorObj,
              halfW - 2,
              Number(siteSize.depth || 80) / 2 - 0.01,
              0,
              4,
              1,
              5,
              0,
              "wall_front"
            );
            doorPlaced.updateMatrixWorld(true);
            contentGroup.add(doorPlaced);
            indoorDoorObject = doorPlaced;
          }
        }
      }

      makeGrid(minX, maxX, minZ, maxZ);
      applyDebugVisibility();

      if (!restoredCameraState) {
        controls.target.set(0, 0, 0);
        camera.position.set(w * 0.75, Math.max(25, d * 0.55), d * 0.75);
      }
      controls.update();
      markBackFacingOpacityDirty();
      applyBackFacingOpacity();

      setStatus(`完成: ${loaded}/${entries.length} 个实例\nsiteId=${siteId}, rank=${playerRank}, siteLevelId=${siteLevelId}, size=${siteSize.width}x${siteSize.depth}`);
    }

    async function reload() {
      try {
        saveOptionsToStorage();
        setStatus("重读JSON并重建...");
        if (!fixtureMetaMap.size) await initFixtureMeta();
        const layoutPath = layoutPathEl.value.trim();
        const siteId = Number(siteIdEl.value || 1);
        const types = getAlwaysEnabledLayoutTypes();
        await buildScene(layoutPath, types, siteId, { forceFreshLayout: true });
      } catch (e) {
        console.error(e);
        setStatus(`失败: ${e.message}`);
      }
    }

    function resetCameraToDefault() {
      restoredCameraState = false;
      controls.target.set(0, 0, 0);
      camera.position.set(60, 45, 60);
      camera.up.set(0, 1, 0);
      controls.update();
      saveOptionsToStorage();
    }

    reloadBtn.addEventListener("click", reload);
    resetCameraBtn.addEventListener("click", resetCameraToDefault);
    layoutPathEl.addEventListener("change", saveOptionsToStorage);
    siteIdEl.addEventListener("change", async () => {
      saveOptionsToStorage();
      await reload();
    });
    controls.addEventListener("end", saveOptionsToStorage);
    window.addEventListener("beforeunload", saveOptionsToStorage);
    window.addEventListener("resize", () => {
      renderer.setSize(app.clientWidth, app.clientHeight);
      camera.aspect = app.clientWidth / app.clientHeight;
      camera.updateProjectionMatrix();
      axesRenderer.setSize(axesView.clientWidth, axesView.clientHeight);
      axesCamera.aspect = axesView.clientWidth / axesView.clientHeight;
      axesCamera.updateProjectionMatrix();
    });

    function tick() {
      const MOVE_SPEED = 0.35; // 略微调低
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() > 1e-8) forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
      const offset = new THREE.Vector3();
      if (keyState.w) offset.addScaledVector(forward, MOVE_SPEED);
      if (keyState.s) offset.addScaledVector(forward, -MOVE_SPEED);
      if (keyState.d) offset.addScaledVector(right, MOVE_SPEED);
      if (keyState.a) offset.addScaledVector(right, -MOVE_SPEED);
      if (keyState.space) offset.y += MOVE_SPEED;
      if (keyState.shift) offset.y -= MOVE_SPEED;
      if (offset.lengthSq() > 0) moveCameraRig(offset);
      controls.update();
      applyBackFacingOpacity();
      renderer.render(scene, camera);
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      axesCamera.position.copy(dir.clone().multiplyScalar(-2.5));
      axesCamera.up.copy(camera.up);
      axesCamera.lookAt(0, 0, 0);
      updateAxesLabels();
      axesRenderer.render(axesScene, axesCamera);
      requestAnimationFrame(tick);
    }
    tick();
    loadOptionsFromStorage();
    applyHudVisibility();
    applyDebugVisibility();
    reload();
  </script>
</body>
</html>
